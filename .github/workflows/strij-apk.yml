# «Стриж» — сборка Android APK (Фаза 1), БЕЗ секретов/ключа.
# Собирает release-APK; без key.properties Gradle подписывает его DEBUG-ключом (build.gradle:120) —
# такой APK НОРМАЛЬНО ставится сайдлоадом (для теста среди знакомых достаточно). Настоящий релиз-ключ
# подключим позже перед широкой раздачей (тогда друзьям — переустановка один раз).
# Самодостаточный job (не завязан на тяжёлый ci.yml: без iOS/Play/VirusTotal и без общего test).
#
# Запуск: Actions → «Strij APK» → Run workflow (ветка main).
# Результат: ОДИН артефакт `Strij-universal` → Strij-Android-universal.apk (универсальный, arm64+arm7).
name: Strij APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: dev или prod (ядро hiddify-core и main-файл). Для Фазы 1 — dev.
        type: string
        default: dev

env:
  CHANNEL: ${{ inputs.channel }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-flutter
        with:
          platform: android-apk
          generated-code: false

      # Brand the LEGACY raster launcher icons (mipmap-*/ic_launcher*.webp). MIUI/Xiaomi and some
      # other launchers ignore the adaptive vector icon and use these rasters, so the vector-only
      # rebrand still showed the old Hiddify "Hi". Rasterize the Strij bird into every density and
      # drop the old .webp. The adaptive icon (mipmap-anydpi-v26) is already the bird vector.
      - name: Brand raster assets (launcher icon, splash, notification icon)
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          res=android/app/src/main/res

          # 1) Launcher icon (MIUI/Xiaomi use legacy raster, ignore the adaptive vector).
          icon=assets/images/strij_icon_square.svg
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%:*}; px=${pair#*:}; dir="$res/mipmap-$d"
            [ -d "$dir" ] || continue
            rsvg-convert -w "$px" -h "$px" "$icon" -o "$dir/ic_launcher.png"
            rsvg-convert -w "$px" -h "$px" "$icon" -o "$dir/ic_launcher_round.png"
            rm -f "$dir/ic_launcher.webp" "$dir/ic_launcher_round.webp"
          done

          # 2) Launch splash (Android < 12): the centered splash.png bitmap, bird instead of "Hi".
          splash=assets/images/strij_splash.svg
          for pair in mdpi:96 hdpi:144 xhdpi:192 xxhdpi:288 xxxhdpi:384; do
            d=${pair%:*}; px=${pair#*:}; dir="$res/drawable-$d"
            mkdir -p "$dir"
            rsvg-convert -w "$px" -h "$px" "$splash" -o "$dir/splash.png"
          done

          # 3) Status-bar notification icon (ic_stat_logo): white bird silhouette, Android tints it.
          stat=assets/images/strij_stat.svg
          for pair in mdpi:24 hdpi:36 xhdpi:48 xxhdpi:72 xxxhdpi:96; do
            d=${pair%:*}; px=${pair#*:}; dir="$res/drawable-$d"
            mkdir -p "$dir"
            rsvg-convert -w "$px" -h "$px" "$stat" -o "$dir/ic_stat_logo.png"
          done

          ls -R "$res"/mipmap-* "$res"/drawable-*

      # ОДИН универсальный («полный») APK — arm64 + armeabi-v7a в одном файле, ставится на любой
      # Android-телефон. x86_64 (только эмулятор) намеренно НЕ включаем, чтобы файл был меньше и
      # скачивание артефакта было надёжным. Без --split-per-abi flutter собирает единый fat-APK
      # app-release.apk. Debug-подпись (нет key.properties) — сайдлоад ставится нормально.
      - name: Build universal release APK (debug-signed — no secrets)
        run: |
          if [ "$CHANNEL" = "prod" ]; then TGT=lib/main_prod.dart; else TGT=lib/main.dart; fi
          flutter build apk --release \
            --target "$TGT" \
            --target-platform android-arm,android-arm64 \
            --dart-define sentry_dsn= \
            --dart-define commit="$(git rev-parse --short=7 HEAD)"
          ls -lh build/app/outputs/flutter-apk/

      - name: Collect the universal APK
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/Strij-Android-universal.apk
          ls -lh out/

      # Один артефакт = один .apk (~110 МБ). compression-level 0 (APK уже сжат), чтобы распаковка
      # после скачивания была мгновенной.
      - name: Upload universal APK
        uses: actions/upload-artifact@v6
        with:
          name: Strij-universal
          path: out/Strij-Android-universal.apk
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
